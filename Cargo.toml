[workspace]
members = ["crates/zmem-core", "crates/zmem-store", "crates/zmem-svc"]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
